{% set version = "2.4.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-expsmooth
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/expsmooth_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/expsmooth/expsmooth_{{ version }}.tar.gz
  sha256: 72210091fed361b65e8cf19ce6c0eb5c0d8694eef98c76cc9fbdafce60d5f7c1

build:
  noarch: generic
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:

  host:
    - r-base
    - r-forecast
  run:
    - r-base
    - r-forecast

test:
  commands:
    - $R -e "library('expsmooth')"           # [not win]
    - "\"%R%\" -e \"library('expsmooth')\""  # [win]

about:
  home: https://github.com/robjhyndman/expsmooth
  license: GPL-2.0-or-later
  summary: 'Data sets from the book "Forecasting with exponential smoothing: the state space approach" by  Hyndman, Koehler, Ord and Snyder (Springer, 2008).'
  license_family: GPL3
  license_file: '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
    - philip-khor
